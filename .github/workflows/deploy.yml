# Lädt die Website bei jedem Push auf "main" per FTPS zu ALL-INKL hoch.
# Zugangsdaten stehen als Repository-Secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER   z. B. w022499d.kasserver.com  (siehe KAS > FTP > Info-Button)
#   FTP_USERNAME f0192927
#   FTP_PASSWORD (Passwort des FTP-Nutzers)
name: Deploy zu ALL-INKL

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            firebase-vorschau/**
            README.md
